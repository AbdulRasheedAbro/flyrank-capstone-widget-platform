services:
  db:
    image: postgres:16
    container_name: widget-db
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
      POSTGRES_DB: widgetdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widgetdb"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: